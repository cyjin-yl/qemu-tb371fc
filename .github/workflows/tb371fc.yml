name: TB371FC functional model

on:
  push:
    branches: [tb371fc]
  pull_request:
    branches: [tb371fc]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: tb371fc-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-device-tests:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends build-essential git \
            python3 python3-venv python3-distlib ninja-build meson pkg-config \
            libglib2.0-dev libpixman-1-dev zlib1g-dev libfdt-dev device-tree-compiler
      - name: Build the dedicated machine
        run: BUILD_DIR="$RUNNER_TEMP/qemu-build" JOBS=2 sh tb371fc/scripts/build.sh
      - name: Validate capture parsers and negative cases
        run: |
          python3 tb371fc/scripts/test_board_profile.py
          python3 tb371fc/scripts/test_validate_machine.py
      - name: Compare running QEMU configuration with the real tablet capture
        run: |
          python3 tb371fc/scripts/validate_machine.py \
            --qemu "$RUNNER_TEMP/qemu-build/qemu-system-aarch64" \
            --output "$RUNNER_TEMP/machine-profile-validation.json"
      - name: Exercise UART registers, interrupts, reset and migration
        run: |
          python3 tb371fc/tests/test_geni_uart.py \
            --qemu "$RUNNER_TEMP/qemu-build/qemu-system-aarch64"
          python3 tb371fc/tests/test_geni_migration.py \
            --qemu "$RUNNER_TEMP/qemu-build/qemu-system-aarch64"
      - name: State the validation boundary
        if: always()
        run: |
          printf '%s\n' 'This job tests the implemented board configuration and GENI FIFO model.' \
            'It does not attest stock Android boot, Adreno rendering, or hardware equivalence.' \
            'Linux boot evidence is recorded separately with the exact externally supplied kernel hash.' \
            >> "$GITHUB_STEP_SUMMARY"
