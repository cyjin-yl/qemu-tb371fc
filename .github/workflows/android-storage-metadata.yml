name: Android storage metadata checks

on:
  push:
    branches: ['**']
    paths:
      - 'tb371fc/scripts/inspect_ufs_gpt.py'
      - 'tb371fc/scripts/test_inspect_ufs_gpt.py'
      - 'tb371fc/scripts/inspect_android_super.py'
      - 'tb371fc/scripts/test_inspect_android_super.py'
      - 'tb371fc/scripts/inspect_vbmeta_metadata.py'
      - 'tb371fc/scripts/test_inspect_vbmeta_metadata.py'
      - '.github/workflows/android-storage-metadata.yml'
  pull_request:
    paths:
      - 'tb371fc/scripts/inspect_ufs_gpt.py'
      - 'tb371fc/scripts/test_inspect_ufs_gpt.py'
      - 'tb371fc/scripts/inspect_android_super.py'
      - 'tb371fc/scripts/test_inspect_android_super.py'
      - 'tb371fc/scripts/inspect_vbmeta_metadata.py'
      - 'tb371fc/scripts/test_inspect_vbmeta_metadata.py'
      - '.github/workflows/android-storage-metadata.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: android-storage-metadata-${{ github.ref }}
  cancel-in-progress: true

defaults:
  run:
    shell: bash

jobs:
  public-metadata-fixtures:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - name: Run GPT, super and vbmeta tests without skips
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/android-storage-metadata"
          python3 - <<'PY' 2>&1 | tee "$RUNNER_TEMP/android-storage-metadata/tests.log"
          import hashlib
          import json
          import os
          from pathlib import Path
          import subprocess
          import sys
          import unittest

          scripts = Path("tb371fc/scripts")
          sys.path.insert(0, str(scripts.resolve()))
          modules = ("test_inspect_ufs_gpt", "test_inspect_android_super",
                     "test_inspect_vbmeta_metadata")
          inputs = [scripts / name for name in (
              "inspect_ufs_gpt.py", "test_inspect_ufs_gpt.py",
              "inspect_android_super.py", "test_inspect_android_super.py",
              "inspect_vbmeta_metadata.py", "test_inspect_vbmeta_metadata.py")]
          inputs.append(Path(".github/workflows/android-storage-metadata.yml"))
          source_hashes = {str(path): hashlib.sha256(path.read_bytes()).hexdigest()
                           for path in inputs}
          reports = []
          for module in modules:
              suite = unittest.defaultTestLoader.loadTestsFromName(module)
              expected = suite.countTestCases()
              result = unittest.TextTestRunner(verbosity=2).run(suite)
              passed = (expected > 0 and result.testsRun == expected
                        and result.wasSuccessful() and not result.skipped
                        and not result.expectedFailures)
              reports.append({
                  "module": module, "discovered": expected,
                  "ran": result.testsRun, "skipped": len(result.skipped),
                  "failures": len(result.failures), "errors": len(result.errors),
                  "expected_failures": len(result.expectedFailures),
                  "unexpected_successes": len(result.unexpectedSuccesses),
                  "passed": passed,
              })
          receipt = {
              "scope": "public synthetic metadata fixtures; no device capture or Android runtime",
              "commit": subprocess.check_output(["git", "rev-parse", "HEAD"], text=True).strip(),
              "python": sys.version,
              "source_sha256": source_hashes,
              "suites": reports,
              "passed": all(report["passed"] for report in reports),
              "device_capture_verified": False,
              "android_boot_verified": False,
          }
          output = Path(os.environ["RUNNER_TEMP"]) / "android-storage-metadata/result.json"
          output.write_text(json.dumps(receipt, indent=2) + "\n")
          print(json.dumps(receipt, indent=2))
          raise SystemExit(0 if receipt["passed"] else 1)
          PY
      - name: Preserve fixture results and source hashes
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: android-storage-metadata-${{ github.run_id }}-${{ github.run_attempt }}
          retention-days: 14
          if-no-files-found: error
          path: ${{ runner.temp }}/android-storage-metadata/
      - name: State the tested scope
        if: always()
        run: |
          printf '%s\n' \
            'This job runs the public GPT, super and vbmeta metadata unit suites. Missing inputs, empty suites, skips and failures fail the job.' \
            'The artifact records the tested checkout, source hashes, Python version and per-suite counts. Read result.json and the job conclusion for the actual verdict.' \
            'These are synthetic metadata tests. They do not validate a private capture, AVB, snapshot merge state, partition payloads or Android boot.' \
            >> "$GITHUB_STEP_SUMMARY"
