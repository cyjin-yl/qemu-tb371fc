name: TB371FC offline stock evidence

on:
  pull_request:
    branches: [tb371fc]
    paths:
      - 'tb371fc/scripts/verify_stock_android_boot_evidence.py'
      - 'tb371fc/tests/test_stock_android_boot_evidence.py'
      - 'tb371fc/docs/stock-android-boot-evidence.md'
      - '.github/workflows/tb371fc-stock-evidence.yml'
  push:
    paths:
      - 'tb371fc/scripts/verify_stock_android_boot_evidence.py'
      - 'tb371fc/tests/test_stock_android_boot_evidence.py'
      - 'tb371fc/docs/stock-android-boot-evidence.md'
      - '.github/workflows/tb371fc-stock-evidence.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  offline-contract:
    name: Synthetic offline evidence tests
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    env:
      PYTHONDONTWRITEBYTECODE: '1'
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4; same pin as board CI
        with:
          persist-credentials: false
      - name: Validate the artifact contract without QEMU or firmware
        run: python3 -m unittest discover -s tb371fc/tests -p 'test_stock_android_boot_evidence.py' -v
